<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuração ao vivo · Eleições 2026 · Vizu Dados</title>
<meta name="description" content="A apuração do 2º turno de 2026, atualizada a cada minuto pela API pública do TSE.">
<style>
  @font-face{font-family:'Sora Vizu';font-style:normal;font-weight:100 900;font-display:block;src:url(fontes/sora-vizu.woff2) format('woff2')}
  @font-face{font-family:'Sora Eleicoes';font-style:normal;font-weight:300 800;font-display:block;src:url(fontes/sora-eleicoes.woff2) format('woff2')}
  html,body{margin:0;padding:0;background:#F1EBDF}
  body:not(.celular){overflow:hidden}
  #quadro{position:relative;width:100%;overflow:hidden;background:#F1EBDF}
  #palco{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;visibility:hidden}
  #palco.pronto{visibility:visible}
  #filtro{position:absolute;left:1282px;top:60px;width:424px;height:48px;z-index:20}
  #filtro-sel{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
  #filtro:focus-within > div{outline:2px solid #1C1915;outline-offset:2px}
  /* quadrados ou mapa: no canto vazio do mapa, embaixo à direita */
  #modo{position:absolute;left:1548px;top:852px;z-index:350;display:flex;border:1.5px solid #1C1915;border-radius:4px;overflow:hidden}
  #modo button{appearance:none;border:0;margin:0;padding:9px 14px;background:#F1EBDF;color:#48423A;cursor:pointer;
    font:600 13px/1 'Sora Eleicoes','Segoe UI',sans-serif;letter-spacing:.14em;text-transform:uppercase}
  #modo button + button{border-left:1.5px solid #1C1915}
  #modo button.on{background:#1C1915;color:#F1EBDF}
  #modo button:focus-visible{outline:2px solid #2B5797;outline-offset:-4px}
  /* celular: a mesma tela em coluna (resultado, mapa, curva), na largura do aparelho */
  #cel{display:none}
  body.celular #palco{display:none}
  body.celular #quadro{height:auto!important;overflow:visible}
  body.celular #cel{display:block;padding:18px 16px 22px 16px;color:#1C1915;font-family:'Sora Eleicoes','Segoe UI',sans-serif}
  #cel .sob{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#48423A}
  #cel h1{margin:6px 0 14px 0;font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
  #cel .filtro{position:relative;display:flex;align-items:center;height:46px;padding:0 14px;background:#E5DBC8;border:1px solid #CBBDA2;
    border-radius:6px;font-weight:600;font-size:16px;margin-bottom:18px}
  #cel .filtro select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
  #cel .filtro::after{content:'';margin-left:auto;width:8px;height:8px;border-right:1.6px solid #1C1915;border-bottom:1.6px solid #1C1915;
    transform:rotate(45deg) translateY(-3px)}
  #cel .vaga{position:relative;width:100%;margin-bottom:10px}
  #cel #v-modo{display:flex;justify-content:flex-end;margin:0 0 22px 0}
  body.celular #modo{position:static}
  #cel .pe{margin-top:14px;font-size:12px;line-height:1.5;color:#48423A}
</style>
</head>
<body>
<div id="quadro">
  <div id="cel">
    <div class="sob">25 · Apuração</div>
    <h1>Quem está na frente na apuração do 2º turno?</h1>
    <label class="filtro"><span class="rotulo-cel">Recorte</span><select id="filtro-cel" aria-label="Recorte da apuração"></select></label>
    <div class="vaga" id="v-placar"></div>
    <div class="vaga" id="v-mapa"></div>
    <div id="v-modo"></div>
    <div class="vaga" id="v-curva"></div>
    <div class="pe">Fonte: TSE · API pública de divulgação dos resultados, consultada a cada minuto · Brasil = soma das UFs e do exterior · Vizu Dados</div>
  </div>
  <div id="palco">
    <div id="filtro"><select id="filtro-sel" aria-label="Recorte da apuração"></select></div>
    <div id="modo" role="group" aria-label="Como ver o mapa">
      <button type="button" data-modo="quadrados" class="on">Quadrados</button><button type="button" data-modo="mapa">Mapa</button>
    </div>
  </div>
</div>
<script src="apuracao.js?v=20261025-1600"></script>
</body>
</html>
