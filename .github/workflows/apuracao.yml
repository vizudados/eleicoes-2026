# Apuração em tempo real: coleta a API pública de resultados do TSE e grava em dados/apuracao/ no próprio repositório.
# Uma coleta por minuto, quantas o `repetir` pedir. Na noite de 25/10 roda em corrente: uma execução longa (repetir > 50,
# até 6 h) dispara a seguinte antes de acabar, e o workflow `vigia` (a cada 10 min) lança outra se os dados pararem.
# O agendamento a cada 5 min saiu em 25/10, 16h20: o cron do GitHub atrasava no pico e, na mesma fila de concorrência,
# uma execução agendada podia cancelar a próxima da corrente. Fora da noite da eleição, rode à mão (workflow_dispatch).
# Se os segredos do Power BI existirem, o modelo semântico é atualizado pela API logo depois de cada coleta.
name: apuracao

on:
  workflow_dispatch:
    inputs:
      eleicao:
        description: "Código da eleição no TSE (6258 = 2º turno 2026; 6257 = 1º turno, para ensaio)"
        default: "6258"
      repetir:
        description: "Quantas coletas nesta execução"
        default: "4"

permissions:
  contents: write
  actions: write

concurrency:
  group: apuracao
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    # execução longa (repetir > 50) cobre a noite sem depender do cron, que atrasa em horário de pico
    timeout-minutes: 360
    # Segredos como variáveis do job: o GitHub não aceita `secrets` direto numa condição `if` de passo.
    env:
      PBI_TENANT_ID: ${{ secrets.PBI_TENANT_ID }}
      PBI_CLIENT_ID: ${{ secrets.PBI_CLIENT_ID }}
      PBI_CLIENT_SECRET: ${{ secrets.PBI_CLIENT_SECRET }}
      PBI_WORKSPACE_ID: ${{ secrets.PBI_WORKSPACE_ID }}
      PBI_DATASET_ID: ${{ secrets.PBI_DATASET_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar e publicar
        env:
          ELEICAO: ${{ github.event.inputs.eleicao || '6258' }}
          REPETIR: ${{ github.event.inputs.repetir || '4' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "apuracao-bot"
          git config user.email "apuracao-bot@users.noreply.github.com"
          hora_tse() { python -I -c "import json;print(json.load(open('dados/apuracao/ultimo.json',encoding='utf-8')).get('atualizado_tse',''))" 2>/dev/null; }
          for i in $(seq 1 "$REPETIR"); do
            # parte sempre do main mais recente: a execução começa no commit do disparo, que pode estar atrás de outra
            # coleta (o conflito em ultimo.json que derrubou a execução longa de 25/10, 16h10)
            git pull --rebase --quiet || { git rebase --abort 2>/dev/null || true; git fetch --quiet origin main; git reset --quiet --hard origin/main; }
            antes="$(hora_tse)"
            python -I apuracao/coletar.py --eleicao "$ELEICAO" || echo "coleta falhou nesta volta; tenta de novo no próximo minuto"
            git add dados/apuracao
            if ! git diff --cached --quiet; then
              git commit -m "apuração: $(date -u +%H:%M) UTC" --quiet
              # se o push não passar, esta volta se perde (só no clone do runner) e o próximo minuto coleta de novo
              if ! { git pull --rebase --quiet -X theirs && git push --quiet; }; then
                git rebase --abort 2>/dev/null || true; git fetch --quiet origin main; git reset --quiet --hard origin/main
              fi
            fi
            # o Power BI só é atualizado quando o TSE divulga números novos (a hora de totalização muda)
            if [ "$(hora_tse)" != "$antes" ]; then echo "ATUALIZOU=1" >> "$GITHUB_ENV"; fi
            if [ "$i" -lt "$REPETIR" ]; then sleep 60; fi
          done

      # a execução longa passa o bastão a outra antes de acabar, enquanto for noite de apuração (16h às 23h59 de Brasília),
      # mesmo que a coleta tenha falhado (always); e religa a corrente do vigia se ela não estiver rodando
      - name: Passar o bastão
        if: always()
        env:
          ELEICAO: ${{ github.event.inputs.eleicao || '6258' }}
          REPETIR: ${{ github.event.inputs.repetir || '4' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          hora=$(date -u +%H)
          if [ "$REPETIR" -gt 50 ] && { [ "$hora" -ge 19 ] || [ "$hora" -lt 3 ]; }; then
            gh workflow run apuracao.yml -R "$GITHUB_REPOSITORY" -f eleicao="$ELEICAO" -f repetir=200
            vivos=$(gh run list -R "$GITHUB_REPOSITORY" --workflow vigia.yml --limit 5 --json status \
              --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
            if [ "$vivos" = "0" ]; then gh workflow run vigia.yml -R "$GITHUB_REPOSITORY" -f voltas=30; fi
          fi

      - name: Atualizar o modelo no Power BI
        if: env.ATUALIZOU == '1' && env.PBI_CLIENT_ID != ''
        run: python -I apuracao/atualizar_powerbi.py
