# Vigia da apuração: na noite de 25/10, confere a cada 10 minutos se o coletor (workflow `apuracao`) está vivo, sem
# depender de computador ligado. Coleta parada → lança uma execução longa do coletor. Falha repetida → chama um agente
# Claude (Opus) com a chave da API da Vizu (segredo ANTHROPIC_API_KEY) para diagnosticar, corrigir o mínimo e abrir uma
# issue (que chega por e-mail).
# Em 25/10 o cron do GitHub não disparava; por isso o vigia roda em corrente: `voltas` > 1 faz uma conferência a cada
# 10 min por até 6 h e, no fim, dispara a execução seguinte. O coletor, ao passar o bastão, religa esta corrente se ela
# tiver caído; os dois se vigiam.
name: vigia

on:
  schedule:
    # 25/10/2026, das 16h às 0h50 de Brasília (19h–03h50 UTC), se o cron do GitHub voltar a disparar.
    - cron: "3,13,23,33,43,53 19-23 25 10 *"
    - cron: "3,13,23,33,43,53 0-3 26 10 *"
  workflow_dispatch:
    inputs:
      voltas:
        description: "Quantas conferências, uma a cada 10 min (1 = uma só; 30 ≈ 5 h, depois passa o bastão)"
        default: "1"
      testar_agente:
        description: "sim = chama o agente mesmo sem problema, para conferir a chave e o modelo (abre uma issue de teste)"
        default: "nao"

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      problema: ${{ steps.vigia.outputs.problema }}
      resumo: ${{ steps.vigia.outputs.resumo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: vigia
        name: Conferir coletor, dados e TSE
        env:
          GH_TOKEN: ${{ github.token }}
          VOLTAS: ${{ github.event.inputs.voltas || '1' }}
        run: |
          for k in $(seq 1 "$VOLTAS"); do
            python -I apuracao/vigiar.py || echo "conferência falhou nesta volta"
            if [ "$k" -lt "$VOLTAS" ]; then sleep 600; fi
          done
      - name: Passar o bastão
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VOLTAS: ${{ github.event.inputs.voltas || '1' }}
        run: |
          hora=$(date -u +%H)
          if [ "$VOLTAS" -gt 1 ] && { [ "$hora" -ge 19 ] || [ "$hora" -lt 3 ]; }; then
            gh workflow run vigia.yml -R "$GITHUB_REPOSITORY" -f voltas=20
          fi

  corrigir:
    needs: conferir
    if: needs.conferir.outputs.problema == '1' || github.event.inputs.testar_agente == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Já existe aviso aberto na última meia hora?
        id: aviso
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --label vigia --state open --json createdAt \
            --jq "[.[] | select((now - (.createdAt | fromdateiso8601)) < 1800)] | length" 2>/dev/null || echo 0)
          echo "recente=$n" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        if: steps.aviso.outputs.recente == '0'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: "--model claude-opus-5-5 --max-turns 40 --allowedTools Bash,Read,Edit,Write,Grep,Glob"
          prompt: |
            Você é o vigia da apuração do 2º turno de 2026 (domingo, 25/10) no repositório ${{ github.repository }}.
            O conferidor automático achou este problema: ${{ needs.conferir.outputs.resumo }}
            ${{ github.event.inputs.testar_agente == 'sim' && 'ESTE É UM TESTE pedido pela equipe: não há problema real. Não mexa em código nem dispare workflows; só confira o estado (passo 1) e abra a issue com o título "Teste do vigia: agente ok" resumindo o que viu.' || '' }}

            Contexto: o workflow `apuracao` (.github/workflows/apuracao.yml) roda apuracao/coletar.py uma vez por minuto
            em execuções longas encadeadas (repetir=200, cada uma dispara a seguinte), lê a API pública do TSE (eleição
            6258) e comita dados/apuracao/ (ultimo.json, ufs.csv, historico.csv, exterior.csv). O total do Brasil é a soma
            das 27 UFs e do exterior. O painel do Power BI e a página ao vivo do site dependem desses arquivos.

            Faça, nesta ordem:
            1. Diagnostique: `gh run list --workflow apuracao.yml --limit 8` e `gh run view <id> --log-failed` das falhas.
            2. Se a causa for o código (apuracao/coletar.py ou o workflow), corrija o mínimo necessário. Teste com
               `python -I apuracao/coletar.py --eleicao 6257 --saida /tmp/t1` (o Brasil tem de dar Flávio 56.104.503 e
               Lula 53.879.538 votos) e com `--eleicao 6258 --saida /tmp/t2`. Só então comite no main com mensagem em
               pt-BR (git pull --rebase antes do push; nunca force) e, se nenhuma execução do apuracao estiver rodando,
               dispare `gh workflow run apuracao.yml -f eleicao=6258 -f repetir=200`.
            3. Se a causa for externa (TSE fora do ar, GitHub instável), não mexa no código.
            4. Abra uma issue com o rótulo `vigia` (crie o rótulo se não existir), título curto em pt-BR, dizendo o que
               aconteceu, a causa e o que você fez. Mensagens curtas, sem opinião política.
            Regras: não apague dados, não use reset --hard nem push --force, não imprima segredos, não mexa em pbi/.
